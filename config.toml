# ================================================================
# PATHFINDER — Supabase CLI Configuration
# Docs: https://supabase.com/docs/guides/cli/config
# ================================================================

[api]
enabled     = true
port        = 54321
schemas     = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows    = 1000

[db]
port         = 54322
shadow_port  = 54320
major_version = 15

[db.pooler]
enabled          = false
port             = 54329
pool_mode        = "transaction"
default_pool_size = 20
max_client_conn   = 100

[realtime]
enabled    = true
ip_version = "IPv4"

[studio]
enabled  = true
port     = 54323
api_url  = "http://127.0.0.1"

[inbucket]
enabled   = true
port      = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled         = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = true

[auth]
enabled                        = true
# Must match VITE_SITE_URL in .env.local
site_url                       = "http://127.0.0.1:3000"
# Add your production domain here before going live
additional_redirect_urls       = ["https://YOUR_PRODUCTION_DOMAIN.com/auth/callback"]
jwt_expiry                     = 3600
enable_refresh_token_rotation  = true
refresh_token_reuse_interval   = 10
enable_signup                  = true
enable_anonymous_sign_ins      = false
minimum_password_length        = 8

[auth.email]
enable_signup         = true
double_confirm_changes = true
# Set to true in production so users verify their email
enable_confirmations  = false

[auth.sms]
enabled = false

# ── OAuth Providers ───────────────────────────────────────────
# Credentials are managed in the Supabase Dashboard → Auth → Providers.
# The env() references below pull from supabase/.env (local dev only).
# For production they come from the Dashboard directly.

[auth.external.google]
enabled      = true
client_id    = "env(GOOGLE_CLIENT_ID)"
secret       = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""
url          = ""

[auth.external.apple]
enabled      = true
client_id    = "env(APPLE_CLIENT_ID)"
secret       = "env(APPLE_CLIENT_SECRET)"
redirect_uri = ""
url          = ""

# Note: Supabase identifies Meta's OAuth as "facebook" —
# this matches the PROVIDER_MAP in pathfinder-chat-director-react.jsx
[auth.external.facebook]
enabled      = true
client_id    = "env(FACEBOOK_APP_ID)"
secret       = "env(FACEBOOK_APP_SECRET)"
redirect_uri = ""
url          = ""

# ── Edge Functions ────────────────────────────────────────────
[edge_runtime]
enabled = true
policy  = "oneshot"

# verify_jwt = false means the function handles JWT verification
# itself via supabase.auth.getUser() — giving us full control
# over error shapes and per-user rate limiting.
[functions.chat-director]
verify_jwt = false

[analytics]
enabled = false

[experimental]
oriole_db = false
